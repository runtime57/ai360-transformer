model:
  _target_: src.model.GPT
  decoder:
    _target_: src.model.TransformerDecoder
    d_model: 512
    vocab_size: 1
    num_layers: 6
    num_heads: 8
    seq_dropout: 0.1
    ffn_dropout: 0.1
    attn_dropout: 0.1
    use_trainable_pos_embeds: false
    max_seq_len: ${max_seq_len}
    use_alibi: true
    use_flash_attn: false
  beam_width: 8
  context_len: ${max_seq_len}
  max_new_tokens: 2048
metrics:
  device: auto
  train: []
  inference: []
datasets:
  test:
    _target_: src.datasets.TinyStoriesDataset
    part: test
    max_seq_len: ${max_seq_len}
    val_ratio: 0.01
    tokenization_workers: 8
    transforms: ${instance_transforms.inference}
dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: 128
  num_workers: 4
  pin_memory: true
batch_transforms:
  train: null
  inference: null
instance_transforms:
  train: null
  inference: null
tokenizer:
  instance:
    _target_: src.tokenizers.BpeTokenizer
    vocab_size: 4096
    min_frequency: 2
  use_dataset_get_train_text_func: true
  vocab_path: /home/justiee/hse/ai360-transformer/work/test_inference_20261013_7cef162/tokenizer.json
  override: false
loss:
  _target_: src.loss.CrossEntropyLoss
  temperature: 1.0
  label_smoothing: 0.0
  ignore_class_id: 0
inferencer:
  device_tensors:
  - seq
  - target
  device: cuda
  seed: 42
  from_pretrained: /home/justiee/hse/ai360-transformer/saved/tiny_stories_alibi/model_best.pth
max_seq_len: 512
