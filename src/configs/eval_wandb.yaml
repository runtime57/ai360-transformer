defaults:
  - model: gpt_rope
  - datasets: tiny_stories_eval
  - dataloader: main
  - batch_transforms: empty
  - instance_transforms: empty
  - tokenizer: bpe_tiny_stories
  - loss: cross_entropy
  - _self_

model:
  telescopic: True

trainer:
  seed: 42

eval:
