_target_: src.model.GPT
decoder:
  _target_: src.model.TransformerDecoder
  d_model: 512
  vocab_size: 1
  num_layers: 6
  num_heads: 8
  seq_dropout: 0.1
  ffn_dropout: 0.1
  attn_dropout: 0.1
  use_trainable_pos_embeds: False
  max_seq_len: ${max_seq_len}
  use_rope: True
  use_only_rope: True
  attention_type: softmax
  linear_chunk_size: 64
  linear_eps: 1e-6
beam_width: 8
context_len: ${max_seq_len}
max_new_tokens: 2048
