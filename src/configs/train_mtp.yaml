# multi-token prediction experiment: python train.py --config-name=train_mtp
defaults:
  - model: gpt_mtp
  - writer: cometml_mtp
  - metrics: empty
  - datasets: tiny_stories
  - dataloader: main
  - batch_transforms: empty
  - instance_transforms: empty
  - tokenizer: bpe_tiny_stories
  - optimizer: adam
  - lr_scheduler: warmup_cosine
  - loss: mtp_ce
  - _self_

trainer:
  log_step: 50
  epochs: 10
  epoch_len: null
  device_tensors: ["seq", "target"]
  resume_from: null
  use_amp: True
  amp_dtype: float16
  device: auto
  override: False
  monitor: "min val_loss"
  save_period: 2
  early_stop: ${trainer.epochs}
  save_dir: "saved"
  seed: 42

max_seq_len: 512
n_future_tokens: 4

datasets:
  train:
    n_future_tokens: ${n_future_tokens}
  val:
    n_future_tokens: ${n_future_tokens}
