defaults:
  - model: gpt
  - metrics: empty
  - datasets: tiny_stories_test
  - dataloader: main
  - batch_transforms: empty
  - instance_transforms: empty
  - tokenizer: bpe_tiny_stories
  - loss: cross_entropy
  - _self_

tokenizer:
  vocab_path: saved/tiny_stories/tokenizer.json

inferencer:
  device_tensors: ["seq", "target"]
  device: auto
  seed: 42
  from_pretrained: saved/tiny_stories/model_best.pth

max_seq_len: 512
