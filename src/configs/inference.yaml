defaults:
  - model: gpt
  - writer: wandb # disabled_wandb
  - metrics: empty
  - datasets: tiny_stories
  - dataloader: main
  - batch_transforms: empty
  - instance_transforms: empty
  - tokenizer: bpe_tiny_stories
  - optimizer: adam
  - lr_scheduler: warmup_cosine
  - loss: telescopic_loss
  - _self_


inferencer:
  device_tensors: ["seq", "target"]
  resume_from: null
  use_amp: False
  amp_dtype: float16
  device: auto
  monitor: "min val_loss"
  from_pretrained: "saved/model_best.pth" # path to the pretrained model
  save_dir: "saved"
  seed: 42

max_seq_len: 512
