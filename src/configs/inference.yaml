defaults:
  - model: gpt
  - writer: wandb
  - metrics: telescopic_metric
  - datasets: tiny_stories_inference
  - dataloader: main
  - batch_transforms: empty
  - instance_transforms: empty
  - tokenizer: bpe_tiny_stories
  - _self_

inferencer:
  device_tensors: ["seq", "target"]
  use_amp: False
  device: auto

  from_pretrained: "saved/testing/model_best.pth"
  save_path: "inference"
  save_dir: "saved"
  seed: 42

max_seq_len: 512